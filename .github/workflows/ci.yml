name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m "not live and not blender"
      - name: Exercise installed wheel plugin and MCP stage changes
        run: |
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/wheels"
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          python -c 'from antigravity3d.plugin_install import bundle_dir; assert "_plugin_bundle" in bundle_dir().parts'
          python -m pytest -q "$GITHUB_WORKSPACE/tests/test_installed_plugin_runtime.py" "$GITHUB_WORKSPACE/tests/test_mcp_server.py"
