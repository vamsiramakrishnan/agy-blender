name: Wheel and engine qualification
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: engine-qualification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  stock-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BLENDER_BIN: /tmp/engines/blender-5.3.0-linux-x64/blender
      GODOT_BIN: /tmp/engines/Godot_v4.7.2-stable_linux.x86_64
      AGY3D_THREE_JS: /tmp/engines/three.module.min.js
      AGY3D_BLENDER_SOAK: "1"
      AGY3D_BLENDER_SKILLS: ${{ github.workspace }}/third-party/blender-skills
      LIBGL_ALWAYS_SOFTWARE: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EL4CTEO/blender-skills
          ref: 9e7e04a603c125a0d17447ab97112fa70a865067
          path: third-party/blender-skills
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the distributable and exercise plugin discovery
        run: |
          pip wheel --no-deps . -w /tmp/wheels
          pip install /tmp/wheels/*.whl pytest pytest-asyncio playwright
          cd /tmp
          agy3d models
          agy3d plugin install --target /tmp/installed-plugin
      - uses: actions/cache@v4
        with:
          path: /tmp/engines/archives
          key: blender5.3.0-godot4.7.2-three0.160.0-linux-x64-v1
      - name: Install pinned engine binaries and browser
        run: |
          mkdir -p /tmp/engines/archives
          cd /tmp/engines/archives
          if ! test -f blender.tar.xz; then
            for mirror in https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release https://download.blender.org/release; do
              if curl -fsSL --retry 2 --connect-timeout 15 --max-time 240 -o blender.part "$mirror/Blender5.3/blender-5.3.0-linux-x64.tar.xz"; then
                mv blender.part blender.tar.xz
                break
              fi
            done
          fi
          test -f godot.zip || curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          gzip -dc "$GITHUB_WORKSPACE/src/antigravity3d/artifacts/vendor/three-r160.module.min.js.gz" > three.js
          sha256sum -c <<'SUMS'
          dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05  blender.tar.xz
          cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip
          3e690ac7d180b0aadf0891bea39eec643e29e2d3e75c99b18689518665f69ba6  three.js
          SUMS
          tar xf blender.tar.xz -C /tmp/engines
          unzip -q godot.zip -d /tmp/engines
          cp three.js "$AGY3D_THREE_JS"
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            playwright install --with-deps chromium
          fi
      - name: Test native workers, engine imports, rendered frames and inspector channels
        id: tests
        run: |
          xvfb-run -a python -m pytest -q --junitxml=/tmp/engine-qualification.xml tests/test_blender_pool.py tests/test_blender_shim.py tests/test_engine_validators.py tests/test_package.py tests/test_inspector.py tests/test_export_uv_layout.py tests/test_web_three.py tests/test_art_direction.py
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          required = {"test_three_worker_mixed_asset_soak", "test_reviewed_upstream_primitives",
                      "test_vendored_blender_skills_match_the_pinned_checkout",
                      "test_upstream_primitives_on_a_package_match_the_fake_shape_and_weld_closes_seams",
                      "test_ten_relocated_golden_packages_load_in_stock_godot",
                      "test_ten_relocated_golden_dcc_engine_silhouettes",
                      "test_staged_lookdev_and_export_share_one_imported_mesh_atlas",
                      "test_refinement_lookdev_fixer_and_verification_reuse_the_same_atlas",
                      "test_browser_channels_canvas_and_budget", "test_exported_inspector_opens_with_browser_offline",
                      "test_mcp_app_in_a_browser_host", "test_committed_app_build_is_current",
                      "test_browser_good_package_passes_and_frame_is_upright_framed_textured",
                      "test_browser_replaced_mesh_fails_on_silhouette_alone",
                      "test_godot_imports_far_lods_of_a_relocated_package_with_their_textures",
                      "test_browser_far_lods_load_their_referenced_textures_and_match_lod0",
                      "test_browser_far_lod_with_a_missing_texture_fails",
                      "test_styled_package_imports_in_stock_godot_and_passes_the_web_check",
                      "test_capped_hull_imports_in_stock_godot_as_its_collision_shape",
                      "test_godot_draws_a_package_without_hidden_contact_faces_like_the_closed_one",
                      *(f"test_upstream_kit_check_passes_every_piece_of_an_offline_kit[{metric}]" for metric in ("interior", "exterior")),
                      *(f"test_browser_asymmetric_block_passes_for_every_target_engine[{engine}]"
                        for engine in ("unreal_5", "unity_urp", "godot_4", "roblox_r15"))}
          passed = {c.get("name") for c in ET.parse("/tmp/engine-qualification.xml").iter("testcase")
                    if not any(c.find(tag) is not None for tag in ("skipped", "error", "failure"))}
          if missing := required - passed:
              raise SystemExit(f"Required engine qualifications did not pass: {sorted(missing)}")
          PYTHON
      # Timings of the real engines (Blender pool, Godot import, Blender versus the kernels). The tests above
      # say whether the engines work; this says how long they take. It also runs when a test failed (the numbers
      # are labelled with the test outcome in the JSON) but not when the run was cancelled. A measurement that
      # is unavailable is recorded inside the JSON and does not fail anything; a crash of the benchmark itself
      # shows as a failed step plus a warning annotation but does not fail the job, so it cannot mask or replace
      # the test result. Cost on a hosted runner: about one minute, half of it the three EEVEE renders on software
      # GL (3 Blender cold starts of ~0.4 s, 8 renders, 3 Godot packages x 3 imports, kernel work on 4 meshes); the
      # upstream checks survey (about 125 inspect_usd calls on small packages, planted defects and kit pieces) is estimated at 40-80 s more, unmeasured on a runner so far. The soft budget inside the script skips late measurements after 240 s (the survey stops at 80 % of it) and the step timeout is a hard stop. It imports the installed wheel: the script is run by path, so
      # only benchmarks/ (for quality_facts) is added to sys.path, never the checkout's src/.
      - name: Time Blender and Godot paths against the native kernels
        id: engine-bench
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 7
        env:
          AGY_BENCH_TESTS_OUTCOME: ${{ steps.tests.outcome }}
          # empty = unset: the benchmark's worker loads the vendored upstream scripts, as production does (the
          # checkout above is only for the byte comparison in the tests); the JSON records the source it used
          AGY3D_BLENDER_SKILLS: ""
        run: xvfb-run -a python benchmarks/perf_engines.py --out /tmp/engine-bench.json --markdown /tmp/engine-bench.md
      - name: Engine benchmark summary
        if: ${{ !cancelled() }}
        run: |
          if test -f /tmp/engine-bench.md; then
            cat /tmp/engine-bench.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Engine benchmark produced no output (outcome: ${{ steps.engine-bench.outcome }})." >> "$GITHUB_STEP_SUMMARY"
          fi
          if test "${{ steps.engine-bench.outcome }}" != success; then
            echo "::warning title=Engine benchmark::benchmarks/perf_engines.py ${{ steps.engine-bench.outcome }}; see the step log (test results are unaffected)"
          fi
          # one annotation when any single measurement failed (the step itself stays green)
          python - <<'PYTHON'
          import json
          try:
              errors = json.load(open("/tmp/engine-bench.json")).get("errors", [])
          except (OSError, ValueError):
              errors = []
          if errors:
              first = errors[0].replace("\n", " ").replace("%", "%25")[:300]
              print(f"::warning title=Engine benchmark::{len(errors)} measurement(s) failed; first: {first}")
          PYTHON
      - name: Upload engine benchmark
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-bench
          path: |
            /tmp/engine-bench.json
            /tmp/engine-bench.md
          if-no-files-found: warn
