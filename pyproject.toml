[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-3d"
version = "0.2.0"
description = "Layered agentic 3D & game asset production platform on the Google Antigravity SDK, Gemini Decisions API, and OpenUSD"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "google-antigravity>=0.1.24",
  "google-genai>=3.2",
  "usd-core>=25.5",
  "trimesh>=4.4",
  "pygltflib>=1.16",
  "scipy>=1.11",
  "xatlas>=0.0.9",
  "meshoptimizer>=0.2.20a0",
  "coacd>=1.0",
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.12.4",  # MaterialIR.surface uses Field(exclude_if=...), added in 2.12; 2.12.4 keeps such a field out of "required"
  "msgpack>=1.0",
  "pyyaml>=6",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# The three.js package verifier (adapters/engines/web_three.py) drives a Chromium through Playwright. Without this
# extra, or without a browser, the verifier reports "skipped" with the reason; it never passes by default.
web = ["playwright>=1.40"]

[project.scripts]
agy3d = "antigravity3d.cli:main"
agy3d-plugin = "antigravity3d.plugin_install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity3d"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/antigravity-3d" = "antigravity3d/_plugin_bundle/antigravity-3d"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "browser: needs Playwright Chromium and AGY3D_THREE_JS",
  "live: real model calls; needs GEMINI_API_KEY, and runs only with --run-live or AGY3D_RUN_LIVE=1",
  "blender: needs a Blender 5.3+ binary on PATH or $BLENDER_BIN",
]
