<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subjects</title>
<!-- Each subject the page reports sits under one kind of HTML drawn over the canvas, or at the frame's edge. Boxes are
     fractions of the window, as window.__site.info().onScreen gives them; the HTML is placed in the same fractions. -->
<style>html,body{margin:0;background:#101418;color:#eee;font:16px sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
.over{position:fixed;z-index:1;padding:8px;box-sizing:border-box}
#panel{left:4vw;top:20vh;width:30vw;height:50vh;background:rgba(13,15,18,0.94)}
#veil{left:40vw;top:10vh;width:15vw;height:20vh;background:#222;pointer-events:none}
#glass{left:60vw;top:10vh;width:15vw;height:20vh;background:transparent;border:1px solid #eee}
#ghost{left:80vw;top:10vh;width:15vw;height:20vh;background:#000;opacity:0}
#dim{left:40vw;top:40vh;width:15vw;height:20vh;opacity:0.3}
#dim div{background:#000;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<div class="over" id="panel"><h1>A text panel</h1><p>Opaque enough that nothing under it shows.</p></div>
<div class="over" id="veil">An opaque layer the pointer passes through</div>
<div class="over" id="glass">Text on glass: the scene shows around it</div>
<div class="over" id="ghost">Faded out</div>
<div class="over" id="dim"><div></div></div>
<div style="height:300vh"></div>
<script type="module">
import { setup, QUAD } from './gl.js';
const { gl, quad, color } = setup(document.getElementById('c'));
quad(QUAD);
gl.clearColor(0.06, 0.08, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
color(0.9, 0.5, 0.2); gl.drawArrays(gl.TRIANGLES, 0, 6);
window.__site = {
  info: () => ({
    onScreen: {
      under_panel: { share: 0.05, x: 0.17, y: 0.45, box: [0.10, 0.30, 0.25, 0.60], kind: 'prop' },
      under_veil: { share: 0.02, x: 0.47, y: 0.2, box: [0.42, 0.12, 0.53, 0.28] },
      under_glass: { share: 0.02, x: 0.67, y: 0.2, box: [0.62, 0.12, 0.73, 0.28], kind: 'prop' },
      under_ghost: { share: 0.02, x: 0.87, y: 0.2, box: [0.82, 0.12, 0.93, 0.28], kind: 'prop' },
      under_dim: { share: 0.02, x: 0.47, y: 0.5, box: [0.42, 0.42, 0.53, 0.58], kind: 'prop' },
      'CUT LABEL': { share: 0.01, x: 0.92, y: 0.83, box: [0.85, 0.80, 1.10, 0.86], kind: 'label' },
      'CLEAR LABEL': { share: 0.01, x: 0.7, y: 0.67, box: [0.60, 0.65, 0.80, 0.70], kind: 'label' },
      edge_prop: { share: 0.2, x: 0.8, y: 0.67, box: [0.60, 0.40, 1.04, 0.95], kind: 'prop' },
      old_style: { share: 0.1, x: 0.5, y: 0.5 },
    },
  }),
};
</script></body></html>
