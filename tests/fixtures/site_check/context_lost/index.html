<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The scene's context is lost</title>
<!-- The canvas a visitor looks at loses its context after its first frame and is never restored. -->
<style>html,body{margin:0;background:#101418;color:#eee;font:20px sans-serif}canvas{position:fixed;inset:0;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><h1>The scene drew once, then its context was lost.</h1>
<div style="height:300vh"></div>
<script type="module">
import { setup, QUAD } from './gl.js';
const { gl, quad, color } = setup(document.getElementById('c'));
quad(QUAD);
gl.clearColor(0.06, 0.08, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
color(0.8, 0.3, 0.2); gl.drawArrays(gl.TRIANGLES, 0, 6);
requestAnimationFrame(() => gl.getExtension('WEBGL_lose_context')?.loseContext());
</script></body></html>
