<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty middle</title>
<style>html,body{margin:0;background:#101418}canvas{position:fixed;inset:0;width:100vw;height:100vh}
#panel{position:fixed;left:0;top:0;width:45vw;height:100vh;background:#e0705a;color:#000;font:24px sans-serif;padding:2rem;box-sizing:border-box}</style></head>
<body><canvas id="c"></canvas><div id="panel">An opaque panel of HTML over the canvas: the canvas-only frame must not see it.</div>
<div style="height:500vh"></div>
<script type="module">
// Draws only when the scroll changed (a page that renders on demand). Between 40 % and 70 % of the scroll it draws
// nothing but its clear colour: with 9 steps, steps 5 (50 %) and 6 (62 %) show an empty canvas.
import { setup, QUAD } from './gl.js';
const { gl, quad, color } = setup(document.getElementById('c'));
quad(QUAD.map((v, i) => (i % 2 ? v : v * 0.5 + 0.3)));
let last = -1;
function frame() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? scrollY / max : 0;
  if (p !== last) {
    last = p;
    gl.clearColor(0.06, 0.08, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    if (p < 0.4 || p > 0.7) { color(0.2, 0.7, 0.9); gl.drawArrays(gl.TRIANGLES, 0, 6); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
