<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinned subject</title>
<!-- Run 3's phone layout in miniature, through the page hook. The shot's subject 'hero' sits in the same box for the
     first half of the scroll, then moves aside at the same size. Its label is readable except in the last step, where
     it is 9 px tall while the shot is still about it. A layer of slabs, flagged as background, lies under the panel;
     a layer 'deck', the shot's subject too in the last step, runs half out of the frame there. -->
<style>html,body{margin:0;background:#101418;color:#eee;font:16px sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
#panel{position:fixed;left:4vw;top:20vh;width:20vw;height:50vh;background:rgba(13,15,18,0.94);z-index:1}</style></head>
<body><canvas id="c"></canvas><div id="panel"><p>A text panel.</p></div><div style="height:400vh"></div>
<script type="module">
import { setup, QUAD } from './gl.js';
const { gl, quad, color } = setup(document.getElementById('c'));
quad(QUAD);
gl.clearColor(0.06, 0.08, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
color(0.9, 0.5, 0.2); gl.drawArrays(gl.TRIANGLES, 0, 6);
const share = () => scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight);
window.__site = {
  info() {
    const t = share(), held = t <= 0.5 + 1e-3, last = t >= 1 - 1e-3;
    const x = held ? 0.3 : 0.5;
    const on = {
      hero: { share: 0.16, x: x + 0.2, y: 0.5, box: [x, 0.3, x + 0.4, 0.7], kind: 'prop', subject: true },
      'HERO LABEL': { share: 0.01, x: x + 0.2, y: 0.25, kind: 'label', subject: true,
                      box: last ? [x + 0.1, 0.24, x + 0.3, 0.25] : [x + 0.1, 0.2, x + 0.3, 0.26] },
      slabs: { share: 0.05, x: 0.14, y: 0.45, box: [0.06, 0.3, 0.2, 0.6], kind: 'layer', subject: false },
    };
    if (last) on.deck = { share: 0.02, x: 0.9, y: 0.8, box: [0.8, 0.75, 1.2, 0.85], kind: 'layer', subject: true };
    return { onScreen: on };
  },
};
</script></body></html>
