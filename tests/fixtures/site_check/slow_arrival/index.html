<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow arrival</title>
<style>html,body{margin:0;background:#101418}canvas{position:fixed;inset:0;width:100vw;height:100vh}
.panel{position:fixed;left:40px;top:40px;width:300px;height:200px;opacity:0;transition:opacity .3s linear}
.panel.on{opacity:1}#first{background:#c81e1e}#second{background:#1ea01e}</style></head>
<body><canvas id="c"></canvas><div class="panel on" id="first"></div><div class="panel" id="second"></div>
<div style="height:400vh"></div>
<script type="module">
// A heavy page as software WebGL sees it: the first frame at a new position takes more than four seconds, and only then
// do its two panels cross-fade (0.3 s), as run 4's did after the check's jump from the top of the page to its end.
import { setup, QUAD } from './gl.js';
const { gl, quad, color } = setup(document.getElementById('c'));
quad(QUAD);
const SLOW_MS = 4300;
let half = -1;
function frame() {
  requestAnimationFrame(frame);
  const now = scrollY > (document.documentElement.scrollHeight - innerHeight) * 0.75 ? 1 : 0;
  if (now === half) return;
  if (half !== -1) { const t = Date.now(); while (Date.now() - t < SLOW_MS) { /* the frame that draws the new place */ } }
  half = now;
  document.getElementById('first').classList.toggle('on', half === 0);
  document.getElementById('second').classList.toggle('on', half === 1);
  gl.clearColor(0.06, 0.08, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  color(0.2, 0.3, half ? 0.9 : 0.5); gl.drawArrays(gl.TRIANGLES, 0, 6);
}
requestAnimationFrame(frame);
</script></body></html>
